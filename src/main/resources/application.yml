spring:
  application:
    name: print-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/print_service}
    username: ${DATABASE_USERNAME:print_service}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-request-size: 300KB
      max-file-size: 300KB
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  security:
    jwt-secret: ${JWT_SECRET:}
    service-api-key: ${SERVICE_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  firebase:
    credentials: ${FIREBASE_CREDENTIALS:}
  jobs:
    archive-enabled: ${JOB_ARCHIVE_ENABLED:true}
springdoc:
  swagger-ui:
    path: /swagger-ui
